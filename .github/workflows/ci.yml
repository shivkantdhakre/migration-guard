name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Monorepo Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: migrationguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      ALLOW_IN_MEMORY_DB: "true"
      ALLOW_DEV_JWT: "true"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      JWT_SECRET: "migrationguard_super_secure_jwt_dev_secret_key_minimum_32_chars!"
      DATABASE_URL: "postgresql://postgres:testpassword@localhost:5432/migrationguard_test?schema=public"
      MIGRATIONGUARD_TEST_DATABASE_URL: "postgresql://postgres:testpassword@localhost:5432/migrationguard_test?schema=public"
      REDIS_HOST: "localhost"
      REDIS_PORT: 6379
      REDIS_URL: "redis://localhost:6379"
      MONGO_URL: "mongodb://localhost:27017/migrationguard_e2e_source"
      MIGRATIONGUARD_TEST_MONGO_URL: "mongodb://localhost:27017/migrationguard_e2e_source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Build packages
        run: |
          pnpm --filter @migrationguard/core build
          pnpm --filter @migrationguard/worker build
          pnpm --filter @migrationguard/backend build
          pnpm --filter @migrationguard/frontend build

      - name: Initialize PostgreSQL Test Database Schema
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d migrationguard_test -f packages/backend/src/database/schema.sql

      - name: Test Core
        run: pnpm --filter @migrationguard/core test

      - name: Test Worker
        run: pnpm --filter @migrationguard/worker test

      - name: Test Backend
        run: pnpm --filter @migrationguard/backend test
